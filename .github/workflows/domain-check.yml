# Is a domain name free? Run by hand (Actions → Domain check → Run workflow)
# with names separated by spaces. Registry lookups (RDAP, whois for the TLDs
# without RDAP) from GitHub's runner; the answer lands in the run summary.
# "free" means no registration was found: the registrar still sets the
# price, and some free names are premium.
name: Domain check

on:
  workflow_dispatch:
    inputs:
      names:
        description: Domain names, separated by spaces (e.g. buyads.com webuy.ai)
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Look the names up
        env:
          NAMES: ${{ inputs.names }}
        run: |
          sudo apt-get install -y -qq whois >/dev/null 2>&1 || true
          { echo "| Name | Status | Source |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          for d in $NAMES; do
            d=$(echo "$d" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9.-')
            [ -z "$d" ] && continue
            # rdap.org answers 429 when asked too fast: wait and ask again
            for try in 1 2 3 4; do
              code=$(curl -s -L -o /tmp/r.json -w '%{http_code}' --max-time 20 "https://rdap.org/domain/$d" || echo 000)
              [ "$code" = "429" ] || break
              sleep $((try * 8))
            done
            src=rdap
            if [ "$code" = "200" ]; then st=taken
            else
              # rdap.org answers 404 for every name in some TLDs (.io, .co,
              # .studio, .so were caught out with google.io and amazon.co),
              # so a 404 is checked again at the registry's whois
              src="whois"
              out=$(timeout 25 whois "$d" 2>/dev/null || true)
              if echo "$out" | grep -qiE 'creation date|created:|registrar:|registry domain id|domain status: *(client|server|active|ok)'; then st=taken
              elif echo "$out" | grep -qiE 'no match|not found|no entries found|no data found|status: *free|is available|no object found|domain not found'; then st=free
              elif [ "$code" = "404" ]; then st="free?"; src="rdap only"
              else st="unknown ($code)"; fi
            fi
            echo "$d: $st ($src)"
            echo "| $d | $st | $src |" >> "$GITHUB_STEP_SUMMARY"
            sleep 3
          done
