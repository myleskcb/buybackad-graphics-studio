# Deploys `main` to Netlify on every push, so nobody has to deploy by hand
# from the Mac (AGENT-BRIEF.md, "Deploying": the lasting fix). It mirrors
# the Mac command, `netlify deploy --no-build --prod --dir=.` from a clean
# checkout of `main` after `npm ci`, with the function bundled from
# node_modules by the CLI (without --no-build, netlify-cli 26 detects "hugo"
# and fails; without npm ci, every /api/* answers 502).
#
# Inert until these repository secrets exist (Settings → Secrets and
# variables → Actions):
#   NETLIFY_AUTH_TOKEN   Netlify → User settings → Applications → Personal
#                        access tokens → New access token
#   NETLIFY_SITE_ID      the project's Site ID (Project configuration →
#                        General → Project details). buybackad-graphics-studio
#                        is 95709613-cca5-4113-9498-68607779a4e9 (SETUP.md).
#   NETLIFY_SITE_ID_2    optional: the second project (buybackad-finished-copy)
#                        while both are served; the same commit goes to both.
# Set the repository variable NETLIFY_DEPLOY to "off" to pause it.
#
# The second job, sync-finished-copy, needs no secret: it moves the branch
# buybackad-finished-copy builds from (claude/fervent-pascal-w6mthe) to main,
# and Netlify's own build takes it from there.
name: Deploy main to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.NETLIFY_DEPLOY != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_1: ${{ secrets.NETLIFY_SITE_ID }}
      SITE_2: ${{ secrets.NETLIFY_SITE_ID_2 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the function's dependency
        run: npm ci

      - name: Nothing to do without the secrets
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' || env.SITE_1 == '' }}
        run: echo "NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are not set; see the comment at the top of this workflow." && exit 0

      - name: Deploy to production
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.SITE_1 != '' }}
        env:
          NETLIFY_SITE_ID: ${{ env.SITE_1 }}
        run: npx --yes netlify-cli@latest deploy --no-build --prod --dir=. --message "GitHub ${{ github.sha }}"

      - name: Deploy the second project
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.SITE_2 != '' }}
        env:
          NETLIFY_SITE_ID: ${{ env.SITE_2 }}
        run: npx --yes netlify-cli@latest deploy --no-build --prod --dir=. --message "GitHub ${{ github.sha }}"

      - name: What went live
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.SITE_1 != '' }}
        run: |
          U=https://buybackad-graphics-studio.netlify.app
          curl -sS -o /dev/null -w '%{http_code} /\n' $U/
          curl -sS -o /dev/null -w '%{http_code} /colour-builder.js\n' $U/colour-builder.js
          curl -sS -o /dev/null -w '%{http_code} /docs (must be 404)\n' $U/docs/README.md
          curl -sS -o /dev/null -w '%{http_code} /api/me (must be 401)\n' $U/api/me

  # buybackad-finished-copy is linked to this repo in Netlify, but builds from
  # the branch claude/fervent-pascal-w6mthe (its production branch), not main,
  # so for days nothing pushed to main reached it (2026-10-10). This moves
  # that branch to main on every push to main; Netlify sees the push and
  # builds the copy. It needs no secret, only this workflow's own token, so it
  # works while NETLIFY_AUTH_TOKEN is unset. Once the copy's production branch
  # is set to main in Netlify, it is harmless and can go.
  sync-finished-copy:
    if: ${{ vars.NETLIFY_DEPLOY != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BRANCH: claude/fervent-pascal-w6mthe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      - name: Move the copy's branch to this commit
        run: |
          git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          if ! git rev-parse -q --verify "refs/remotes/origin/$BRANCH" >/dev/null \
             || git merge-base --is-ancestor "refs/remotes/origin/$BRANCH" "$GITHUB_SHA"; then
            # the usual case: main contains the branch, so it moves forward, nothing lost
            git push origin "$GITHUB_SHA:refs/heads/$BRANCH"
          else
            # someone pushed to the branch directly: merge main into it, never rewrite it
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git checkout -q -B finished-copy-sync "refs/remotes/origin/$BRANCH"
            git merge --no-edit -m "Merge main (${GITHUB_SHA::8}) so buybackad-finished-copy builds it" "$GITHUB_SHA"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "$BRANCH now carries ${GITHUB_SHA::8}: Netlify builds buybackad-finished-copy from it."
