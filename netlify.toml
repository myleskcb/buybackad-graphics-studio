# 2026-10-06: the owner's judging tools under lab/ (the template, theme, font
# and asset labs, the bulk review, the console and the hero picker). They were
# linked from the landing's nav and footer and served under a noindex header;
# the owner is done with them, so they leave the site. The folder stays in
# the repo as the record of what was judged, and the build scripts still write
# into it: open it from a checkout.
[[redirects]]
  from = "/lab/*"
  to = "/404.html"
  status = 404
  force = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://accounts.google.com 'sha256-e2y+6tieWhkDeXrT/SwKOXU+KbeKb1fsXpNgDwqPpBo=' 'sha256-DRHbjPa87kG3H/N01FQVVZCJxakjOsbCMZFerRYc+nE=' 'sha256-/7GtM5uSWYNGWgg3BNzxMT1KcLN4zeWqVAlFCkCAfBU=' 'sha256-OLeV7otPgYpW3r1P1Mjl/LMZBikIIIbTcOb1RQDQCdQ='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' data: blob: https://*.workers.dev https://cdn.jsdelivr.net https://unpkg.com https://accounts.google.com https://iphones.la; frame-src 'self' https://accounts.google.com; base-uri 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Mirrors _headers — see the note there on why the art is cached hard and the
# app is not.
[[headers]]
  for = "/assets/bg/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/cutouts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/showcase/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# the library's ads at full size (rule 111): the API links them with ?v=<sha1>
[[headers]]
  for = "/assets/library-ads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/geo/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/offer-library.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/template-holds.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
