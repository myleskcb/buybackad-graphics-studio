[build]
  publish = "."

# Internal engineering notes and audit tooling. These are part of the REPO but
# not part of the PRODUCT — docs/ is the study program and DESIGN-LAW.md is the
# house rulebook, neither of which should be fetchable from the marketing site.
# Netlify has no exclude list for a root publish dir, so they are 404'd at the
# edge instead. Kept as a redirect rather than deleting them from the deploy so
# a future build step does not have to special-case the folders.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN-LAW.md"
  to = "/404.html"
  status = 404
  force = true

# Root-level internal markdown. AGENT-BRIEF.md is the onboarding brief for
# agents working on the repo and names the deploy process and the domain
# breakage; CLAUDE.md is the same content when copied to the filename Claude
# Code auto-loads. Neither is product. Add any future root-level internal note
# here — a root publish dir serves everything by default.
[[redirects]]
  from = "/AGENT-BRIEF.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/OPEN-ITEMS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/HANDOFF.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SETUP.md"
  to = "/404.html"
  status = 404
  force = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://accounts.google.com 'sha256-bnBuhr5tZG8PMwCzogFyVA4VPYZ2wALqrQSf1OfMZEs=' 'sha256-6JBrCY01zlAFe92oWqknAuYBryXkqBuK6rbVNErtQQA='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' data: blob: https://*.workers.dev https://cdn.jsdelivr.net https://unpkg.com https://accounts.google.com; frame-src 'self' https://accounts.google.com; base-uri 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Mirrors _headers — see the note there on why the art is cached hard and the
# app is not.
[[headers]]
  for = "/assets/bg/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/cutouts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/showcase/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/geo/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
