[build]
  publish = "."

# Internal engineering notes and audit tooling. These are part of the REPO but
# not part of the PRODUCT — docs/ is the study program and DESIGN-LAW.md is the
# house rulebook, neither of which should be fetchable from the marketing site.
# Netlify has no exclude list for a root publish dir, so they are 404'd at the
# edge instead. Kept as a redirect rather than deleting them from the deploy so
# a future build step does not have to special-case the folders.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN-LAW.md"
  to = "/404.html"
  status = 404
  force = true

# Root-level internal markdown. AGENT-BRIEF.md is the onboarding brief for
# agents working on the repo and names the deploy process and the domain
# breakage; CLAUDE.md is the same content when copied to the filename Claude
# Code auto-loads. Neither is product. Add any future root-level internal note
# here — a root publish dir serves everything by default.
[[redirects]]
  from = "/AGENT-BRIEF.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/OPEN-ITEMS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/HANDOFF.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SETUP.md"
  to = "/404.html"
  status = 404
  force = true

# The node tests for iphonesla-link.js. Repo, not product, like the notes above.
[[redirects]]
  from = "/tests-iphonesla-link.mjs"
  to = "/404.html"
  status = 404
  force = true

