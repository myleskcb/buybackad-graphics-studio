<!doctype html>
<!-- The WeBuy.AD wordmark on a transparent ground, for any wide spot (Stripe's logo,
     a partner's page). ?on=dark draws white words for a dark ground. Reselling.US's
     wordmark, letter for letter in its rules: Inter Tight 750, the ending in the blue. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Inter Tight"; src: url("../../assets/fonts/inter-tight-latin.woff2") format("woff2"); font-weight: 500 800; }
html, body { margin: 0; background: transparent; }
.w { display: inline-block; padding: 40px 56px; font: 750 168px/1 "Inter Tight", sans-serif; letter-spacing: -0.04em; color: #0a1224; white-space: nowrap; }
.on-dark .w { color: #f4f7ff; }
.w span { color: #0a5fe0; } .on-dark .w span { color: #3d8bff; }
</style></head><body><div class="w">WeBuy<span>.AD</span></div>
<script>if (location.search.includes("on=dark")) document.body.className = "on-dark";</script></body></html>
