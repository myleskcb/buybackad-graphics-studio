<!doctype html>
<!-- The WeBuy.AD wordmark on a transparent ground, for any wide spot (Stripe's logo,
     a partner's page). ?on=dark draws white words for a dark ground. Direction D,
     lowercase, as the owner picked it on 2026-11-25 (DESIGN-LAW 153): the mint tag,
     then "webuy.ad" in Inter Tight 800 with ".ad" in the mint. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Inter Tight"; src: url("../../assets/fonts/inter-tight-latin.woff2") format("woff2"); font-weight: 500 800; }
html, body { margin: 0; background: transparent; }
body { --ink: #0a1224; --mint: #0e9f6a; }
body.on-dark { --ink: #f4f7ff; --mint: #2fd58f; }
.w { display: inline-flex; align-items: center; padding: 40px 56px; font: 800 168px/1 "Inter Tight", sans-serif;
  letter-spacing: -0.045em; color: var(--ink); white-space: nowrap; }
.w::before { content: ""; width: 1.05em; height: 1.05em; flex: none; margin-right: .28em; background: var(--mint);
  -webkit-mask: url("../../assets/brand/tag.svg") center / contain no-repeat; mask: url("../../assets/brand/tag.svg") center / contain no-repeat; }
.w em { font-style: normal; color: var(--mint); }
</style></head><body><div class="w">webuy<em>.ad</em></div>
<script>if (location.search.includes("on=dark")) document.body.className = "on-dark";</script></body></html>
