<!doctype html>
<!-- The WeBuy.AD mark on a transparent ground, for any wide spot (Stripe's logo, a partner's
     page): the bubble icon beside the wordmark in Sora, whose period is the mint unread dot
     (DESIGN-LAW 161). ?on=dark draws white words for a dark ground. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "WeBuy Sora"; src: url("../../assets/fonts/sora-700.woff2") format("woff2"); font-weight: 700; }
html, body { margin: 0; background: transparent; }
:root { --wb-blue: #0a5fe0; --wb-mint: #2fd58f; --wb-ring: #ffffff; --wb-ink: #0a1224; }
.on-dark { --wb-blue: #3d8bff; --wb-ring: #070d1c; --wb-ink: #f4f7ff; }
.m { display: inline-flex; align-items: center; gap: 30px; padding: 36px 44px; }   /* fits make.sh's 1000 x 260 window */
.m .wb-icon { width: 150px; height: 150px; }
.m .wb-word { font-size: 124px; }
.wb-icon { display: block; flex: none; }
.wb-icon .wb-b { fill: var(--wb-blue); }
.wb-icon .wb-w { fill: none; stroke: #fff; stroke-width: 7.5; stroke-linejoin: miter; stroke-linecap: butt; }
.wb-icon .wb-d { fill: var(--wb-mint); stroke: var(--wb-ring); stroke-width: 4.5; }
.wb-word { font-family: "WeBuy Sora", sans-serif; font-weight: 700; line-height: 1; letter-spacing: -0.045em; color: var(--wb-ink); white-space: nowrap; }
.wb-word .wb-dot { display: inline-block; width: .25em; height: .25em; margin: 0 .06em 0 .09em; border-radius: 50%; background: var(--wb-mint); color: transparent; overflow: hidden; line-height: .25em; vertical-align: .02em; }
.wb-word .wb-ad { color: var(--wb-blue); }
</style></head><body><div class="m"><svg class="wb-icon" viewBox="9 9 82 82" aria-hidden="true"><path class="wb-b" d="M25 18H75Q86 18 86 29V61Q86 72 75 72H46L29 85Q26 87.5 26 84V72H25Q14 72 14 61V29Q14 18 25 18Z"/><path class="wb-w" d="M30 33L37.5 58L50 36L62.5 58L70 33"/><circle class="wb-d" cx="81" cy="21" r="10"/></svg><span class="wb-word">WeBuy<span class="wb-dot">.</span><span class="wb-ad">AD</span></span></div>
<script>if (location.search.includes("on=dark")) document.body.className = "on-dark";</script></body></html>
