<!doctype html>
<!-- The WeBuy.AD app icon, drawn at 1024 px by tools/brand/make.sh (DESIGN-LAW 165, the owner's pick of
     2026-11-20, "Take 1, the Ad label"): the AD label every platform puts on a paid post, white Libre
     Franklin 900 on the blue, on the navy tile with the blue glow. ?small draws the version for 32 px and
     under, a larger label so its letters hold at a browser tab's size; favicon.svg is that version with
     its letters in outlines. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "WeBuy Franklin"; src: url("../../assets/fonts/libre-franklin-900.woff2") format("woff2"); font-weight: 900; }
html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
svg { display: block; width: 1024px; height: 1024px; }
</style></head><body>
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="g" cx="82%" cy="12%" r="78%"><stop offset="0" stop-color="#1e3c7a"/><stop offset=".55" stop-color="#0c1a38"/><stop offset="1" stop-color="#070d1c"/></radialGradient></defs>
<rect width="100" height="100" fill="url(#g)"/>
<rect id="label" x="12" y="29" width="76" height="42" rx="9" fill="#3d8bff"/>
<text id="ad" x="50" y="51" text-anchor="middle" dominant-baseline="central" font-family="WeBuy Franklin" font-weight="900" font-size="38" fill="#fff">AD</text></svg>
<script>
if (location.search.includes('small')) {
  const l = document.getElementById('label'), t = document.getElementById('ad');
  for (const [k, v] of Object.entries({ x: 6, y: 24, width: 88, height: 52, rx: 10 })) l.setAttribute(k, v);
  t.setAttribute('y', 51.5); t.setAttribute('font-size', 46);
}
</script>
</body></html>
