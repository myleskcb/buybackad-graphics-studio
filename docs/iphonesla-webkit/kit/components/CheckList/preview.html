<!doctype html>
<html>
<head><meta charset="utf-8"><title>CheckList — preview</title>
<style>html,body{margin:0;background:var(--bg)}body{padding:16px}</style></head>
<body class="wk">
<div style="max-width:400px">
  <p class="wk-section">Condition</p>
  <div class="wk-group" role="radiogroup" aria-label="Condition">
        <div class="wk-row wk-row--check" role="radio" aria-checked="false" tabindex="-1" data-value="Like new"><span class="wk-row__t"><b>Like new</b><span>No marks you can see</span></span><span class="wk-check" aria-hidden="true"></span></div>
        <div class="wk-row wk-row--check" role="radio" aria-checked="true" tabindex="0" data-value="Good"><span class="wk-row__t"><b>Good</b><span>Light wear, no cracks</span></span><span class="wk-check" aria-hidden="true"></span></div>
        <div class="wk-row wk-row--check" role="radio" aria-checked="false" tabindex="-1" data-value="Fair"><span class="wk-row__t"><b>Fair</b><span>Scratches or dents, no cracks</span></span><span class="wk-check" aria-hidden="true"></span></div>
        <div class="wk-row wk-row--check" role="radio" aria-checked="false" tabindex="-1" data-value="Cracked"><span class="wk-row__t"><b>Cracked</b><span>Cracked screen or back</span></span><span class="wk-check" aria-hidden="true"></span></div>
      </div>
</div>
<script>LAKit.mount(document);</script>
</body>
</html>
