<!doctype html>
<html>
<head><meta charset="utf-8"><title>GlassBox — preview</title>
<style>html,body{margin:0;background:var(--bg)}body{padding:16px}</style></head>
<body class="wk">
<div style="display:grid;gap:16px">
  <div class="wk-card wk-trade" style="--c-low:var(--trade-card-mid)"><div class="wk-boxes wk-boxes--5" style="padding-bottom:4cqi" data-wk-single>
      <button class="wk-box" type="button" aria-pressed="true"><span class="wk-box__pic"><img src="/_blob/dd0841fd503441ef977336d3017e4085" alt=""></span>iPhone</button>
      <button class="wk-box" type="button" aria-pressed="false"><span class="wk-box__pic"><img src="/_blob/415654fd0aa9245b07243d8ab6496ef2" alt=""></span>iPad</button>
      <button class="wk-box" type="button" aria-pressed="false"><span class="wk-box__pic"><img src="/_blob/5df5b146da312c704141f73020b7cda3" alt=""></span>Mac</button>
      <button class="wk-box" type="button" aria-pressed="false"><span class="wk-box__pic"><img src="/_blob/ae65caf59baa4e2e323736df408dc3c0" alt=""></span>Watch</button>
      <button class="wk-box" type="button" aria-pressed="false"><span class="wk-box__pic"><img src="/_blob/793ca0025bef1e25af6e1e90498e1d96" alt=""></span>AirPods</button>
  </div></div>
  <div class="wk-card wk-wholesale" style="--c-low:var(--wholesale-card-mid)"><div class="wk-boxes wk-boxes--lot" style="padding-bottom:4cqi">
      <div class="wk-box"><span class="wk-box__count">×24</span><span class="wk-box__pic"><img src="/_blob/58d3d1b1012b71604a3a48c2e8c7f1e1" alt=""></span>iPhones</div>
      <div class="wk-box"><span class="wk-box__count">×8</span><span class="wk-box__pic"><img src="/_blob/dd0829c76ce09e64c641adc24168965e" alt=""></span>iPads</div>
      <div class="wk-box"><span class="wk-box__count">×5</span><span class="wk-box__pic"><img src="/_blob/3553a4332d64b62b3207e4eb45897b2d" alt=""></span>Macs</div>
      <span class="wk-arrow" aria-hidden="true">→</span>
      <div class="wk-box wk-box--result"><span class="wk-box__tick" aria-hidden="true">✓</span><b>1 order</b><small>37 devices<br>paid together</small></div>
    </div></div>
</div>
<script>LAKit.mount(document);</script>
</body>
</html>
