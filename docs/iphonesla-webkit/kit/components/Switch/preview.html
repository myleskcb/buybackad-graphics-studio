<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch — preview</title>
<style>html,body{margin:0;background:var(--bg)}body{padding:16px}</style></head>
<body class="wk">
<div class="wk-trade" style="max-width:400px">
  <div class="wk-group">
        <label class="wk-row wk-row--toggle">
          <span class="wk-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg></span>
          <span class="wk-row__t"><b>Use my trade-in</b><span>iPhone 15 Pro · −$330</span></span>
          <span class="wk-switch"><input type="checkbox" role="switch" id="sw-on" checked><span class="wk-switch__track"></span></span>
        </label>
        <label class="wk-row wk-row--toggle">
          <span class="wk-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg></span>
          <span class="wk-row__t"><b>Use my trade-in (off)</b><span>iPhone 15 Pro · −$330</span></span>
          <span class="wk-switch"><input type="checkbox" role="switch" id="sw-off"><span class="wk-switch__track"></span></span>
        </label>
      </div>
  <p class="wk-foot">Turn this off to pay full price and keep your iPhone 15 Pro.</p>
</div>
<script>LAKit.mount(document);</script>
</body>
</html>
