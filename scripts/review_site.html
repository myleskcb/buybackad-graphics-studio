<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Review everything · BUYBACK.AD</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0f13;--panel:#161a21;--line:#252b35;--ink:#e9edf3;--dim:#8b95a5;
      --yes:#2ecc71;--no:#ff4d5e;--tile:230px}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:40;background:rgba(13,15,19,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px 10px}
h1{margin:0 0 8px;font-size:16px;letter-spacing:.2px}
h1 small{color:var(--dim);font-weight:400;margin-left:8px;font-size:12px}
.bar{height:5px;border-radius:3px;background:#1e232c;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .y{background:var(--yes)}.bar .n{background:var(--no)}
.counts{display:flex;gap:14px;margin-top:7px;font-size:12px;color:var(--dim);flex-wrap:wrap;align-items:center}
.counts b{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:#3a4353}
button.on{background:var(--ink);color:#0d0f13;border-color:var(--ink);font-weight:600}
.chip small{opacity:.6;margin-left:5px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.sp{flex:1}
.zoom{display:inline-flex;align-items:center;gap:2px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:2px}
.zoom button{border:0;background:transparent;padding:4px 10px;font-size:15px}
.zoom span{min-width:34px;text-align:center;color:var(--dim);font-size:11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
main{padding:14px 16px 90px}
.gh{margin:22px 0 10px;font-size:13px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
.gh:first-child{margin-top:4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  position:relative;transition:border-color .12s,opacity .12s}
.card.yes{border-color:var(--yes)}
.card.no{border-color:var(--no);opacity:.42}
.card .im{display:block;width:100%;aspect-ratio:4/5;object-fit:contain;background:#0a0c11;
  cursor:zoom-in;border:0;padding:0}
/* CONTAIN, NEVER COVER. The sets mix 4:5, 1:1 and 9:16, and cropping to a
   common tile cut the headline off every square card — you cannot judge an ad
   whose first word is outside the frame. */
.meta{padding:7px 9px 9px}
.nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sw{display:flex;gap:3px;margin-top:5px}
.sw i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.16)}
.vote{display:flex;gap:6px;padding:0 9px 9px}
.vote button{flex:1;padding:6px 0;font-size:13px;font-weight:700;line-height:1}
.vote .y.on{background:var(--yes);border-color:var(--yes);color:#06240f}
.vote .n.on{background:var(--no);border-color:var(--no);color:#2b0409}
.tag{position:absolute;top:8px;right:8px;padding:2px 7px;border-radius:99px;font-size:10px;
  font-weight:700;letter-spacing:.4px}
.tag.y{background:var(--yes);color:#06240f}.tag.n{background:var(--no);color:#2b0409}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:8px;align-items:center;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(13,15,19,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock .hint{color:var(--dim);font-size:11px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);
  padding:0;max-width:min(760px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.66)}
.dh{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600}
.db{padding:14px 16px}
textarea{width:100%;height:280px;background:#0d1016;color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#lb{position:fixed;inset:0;z-index:60;background:rgba(6,8,11,.96);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#lb.open{display:flex}
#lb img{max-width:min(96vw,1100px);max-height:74vh;border-radius:10px;object-fit:contain}
#lbm{color:var(--dim);font-size:12px;text-align:center}
#lbm b{color:var(--ink);font-size:14px;display:block;margin-bottom:2px}
.lbb{display:flex;gap:10px}
.lbb button{padding:10px 22px;font-weight:700}
.empty{color:var(--dim);padding:50px 0;text-align:center}
@media(max-width:560px){:root{--tile:150px}main{padding:12px 10px 92px}}
</style></head><body>
<header>
  <h1>Review everything <small id="sub"></small></h1>
  <div class="bar"><i class="y" id="by"></i><i class="n" id="bn"></i></div>
  <div class="counts">
    <span>approved <b id="cy">0</b></span><span>denied <b id="cn">0</b></span>
    <span>left <b id="cu">0</b></span><span id="saved" style="color:var(--yes)"></span>
  </div>
  <div class="chips" id="groups"></div>
  <div class="tools">
    <button class="chip on" data-st="all">All</button>
    <button class="chip" data-st="undecided">Undecided</button>
    <button class="chip" data-st="yes">Approved</button>
    <button class="chip" data-st="no">Denied</button>
    <span class="sp"></span>
    <span class="zoom"><button id="zo">&minus;</button><span id="zl">230</span><button id="zi">+</button></span>
  </div>
</header>
<main><div id="out"></div></main>
<div class="dock">
  <button id="ay">Approve all shown</button>
  <button id="an">Deny all shown</button>
  <span class="sp"></span>
  <span class="hint">click a picture to enlarge &middot; A approve &middot; D deny &middot; U undo</span>
  <button id="reset">Reset</button>
  <button id="exp" style="font-weight:600">Export</button>
</div>
<div id="lb"><img id="lbi" alt=""><div id="lbm"></div>
  <div class="lbb"><button id="lbn">&#10005; Deny</button><button id="lbu">&#8630;</button><button id="lby">&#10003; Approve</button></div>
  <div class="hint" style="color:var(--dim);font-size:11px">&larr; &rarr; to move &middot; Esc to close</div>
</div>
<dialog id="dlg"><div class="dh">Your decisions</div>
  <div class="db"><textarea id="txt" readonly></textarea></div>
  <div class="df"><button id="copy">Copy</button><button id="close">Close</button></div>
</dialog>
<script src="__JS__"></script>
</body></html>
