<!doctype html><meta charset=utf-8><title>Phone angles</title>
<body><pre id=out></pre><script type=module>
// Every phone the video maker draws, turned through the angles it lands them at,
// in steps of 15 degrees (owner, 2026-10-04: "use the video engine ... full angles
// of every device", "work within 15° increments"): the back, flat and turned 15, 30
// and 45 degrees to either edge, and the screen lit with a wallpaper, flat and turned
// 15 and 30 degrees, drawn by motion/engine.js itself on a clear canvas and trimmed.
// The wallpapers are the showcase engine's own (engine/showcase.mjs WALLS; owner:
// "made the phones have really cool backgrounds on the actual screen"), two per
// phone, in a bold palette that suits its finish.
// scripts/render_phone_views.mjs serves this page, reads the images back and lands
// them as assets/cutouts/view-<phone>--<back|screen_<wall>>-<deg>.webp.
// ?only=17-pro-silver,16-pink draws just those; the phones are the ones in
// motion/phones/index.json in a finish Apple photographed (no repaint): iPhone 16 to 18 Pro
// (owner, 2026-10-04: "use the main models, red, orange, and glacier promax models").
import { loadPhones, Phone, drawPhone } from "../motion/engine.js";
import { WALLS, spread } from "../engine/showcase.mjs";
const q = new URLSearchParams(location.search);
const only = (q.get("only") || "").split(",").filter(Boolean);
const PH = +(q.get("ph") || 900);
const { phones, index } = await loadPhones("../motion/phones/");
const list = index.filter(m => !m.repaint && (!only.length || only.includes(m.id)));

// bold grounds (dark, saturated) with neon leads, one family per finish
const PALS = {
  night:  { dark: '#0a0a14', body: '#7c8194', paper: '#eef0f6', ground: '#0d1440', ground2: '#7b5cff', accent: '#31e1a0', hot: '#ff4d7d', ink: '#050508' },
  arctic: { dark: '#06142a', body: '#8fa2b0', paper: '#f2f8fc', ground: '#0a2a5a', ground2: '#2fc8ff', accent: '#9be7ff', hot: '#ff5ea8', ink: '#050b14' },
  ember:  { dark: '#1b0d08', body: '#a2938b', paper: '#faf5f1', ground: '#3a1206', ground2: '#ff7a2e', accent: '#ffd23a', hot: '#ff3d6e', ink: '#0f0906' },
  candy:  { dark: '#1a0820', body: '#a08fae', paper: '#fff5fb', ground: '#3a0b3f', ground2: '#ff4fa8', accent: '#ffd166', hot: '#4ef0e0', ink: '#0d0710' },
  jewel:  { dark: '#12081a', body: '#8b8fa3', paper: '#f4f5fa', ground: '#3a0a1e', ground2: '#c02a5a', accent: '#ffb23c', hot: '#7b5cff', ink: '#0a0912' },
};
const palFor = id => /orange/.test(id) ? 'ember' : /burgundy/.test(id) ? 'jewel' : /pink/.test(id) ? 'candy'
  : /glacier|blue|white/.test(id) ? 'arctic' : 'night';
const WALLKEYS = ['mesh', 'hills', 'arcs', 'diagonal', 'poly', 'bands', 'field', 'schematic'];
function mkR(seed) {               // xorshift, as the showcase grading pages seed it
  let s = (seed >>> 0) || 1;
  const r = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  return { f: (a, b) => a + (b - a) * r(), pick: a => a[Math.floor(r() * a.length) % a.length],
    chance: p => r() < p, i: (a, b) => Math.floor(a + (b - a + 1) * r()) };
}
const hash = t => [...t].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
async function wallpaper(key, P, w, h, seed, k) {
  const sp = spread(P, 6);
  const Pi = { ...P, accent: sp[k % sp.length], hot: sp[(k + 2) % sp.length], ground2: sp[(k + 4) % sp.length] };
  const out = WALLS[key](0, 0, w, h, Pi, mkR(seed), 'w' + seed);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">` +
    `<rect width="${w}" height="${h}" fill="${P.dark}"/><defs>${out.defs || ''}</defs>${out.body}</svg>`;
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); });
  return img;
}

const BACK = [0, 15, 30, 45], SCREEN = [0, 15, 30];
const W = Math.ceil(PH * 1.3), H = Math.ceil(PH * 1.15);
const c = document.createElement("canvas"); c.width = W; c.height = H;
const x = c.getContext("2d");
const out = [];
function shot(p, m, side, deg, flip, wall) {
  x.clearRect(0, 0, W, H);
  drawPhone(x, p, W / 2, H / 2, 1, 0, flip, 0, 1, W, null, true);
  const a = x.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) if (a[(yy * W + xx) * 4 + 3] > 8) {
    if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy;
  }
  const t = document.createElement("canvas"); t.width = x1 - x0 + 1; t.height = y1 - y0 + 1;
  t.getContext("2d").drawImage(c, -x0, -y0);
  out.push({ phone: m.id, model: m.model, finish: m.finish, side, deg, wall, png: t.toDataURL("image/png") });
}
for (const m of list) {
  const p = new Phone(phones[m.id].img, m, PH);
  for (const d of BACK) for (const s of d ? [-1, 1] : [1]) shot(p, m, "back", s * d, Math.PI + s * d * Math.PI / 180, null);
  // two wallpapers per phone, different from its neighbours'
  const h0 = hash(m.id), P = PALS[palFor(m.id)];
  const sw = Math.round(p.w * (1 - 2 * 0.046)) * 2, sh = Math.round(p.h - p.w * 2 * 0.046) * 2;
  for (const j of [0, 1]) {
    const key = WALLKEYS[(h0 + j * 3) % WALLKEYS.length];
    p.screen = await wallpaper(key, P, sw, sh, h0 + j * 101, h0 + j);
    for (const d of SCREEN) for (const s of d ? [-1, 1] : [1]) shot(p, m, "screen", s * d, s * d * Math.PI / 180, key);
  }
  p.screen = null;
}
document.getElementById("out").textContent = JSON.stringify(out);
document.title = "ready";
</script>
