<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set __SET__ · Template Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#14161c; --panel:#1b1e26; --line:#2c313d; --ink:#e9ebf1; --dim:#8f95a5;
  --keep:#5ad1a5; --pass:#ff7b7b; --accent:#ffb03a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; background:var(--ground); color:var(--ink); overflow-x:hidden}
body{font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
header{position:sticky; top:0; z-index:20; background:var(--ground); border-bottom:1px solid var(--line);
  padding:12px 16px 10px}
h1{font-size:17px; font-weight:800; margin:0 0 2px}
.sub{color:var(--dim); font-size:12.5px; margin:0 0 10px; max-width:78ch}
.meter{display:flex; align-items:center; gap:10px}
.bar{flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease}
.count{font-size:12px; color:var(--dim); white-space:nowrap}
.count b{color:var(--keep); font-weight:700}

main{padding:14px 16px 96px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px}
.card{background:var(--panel); border:3px solid var(--line); border-radius:14px; overflow:hidden;
  cursor:pointer; position:relative; content-visibility:auto; contain-intrinsic-size:260px}
.card img{display:block; width:100%; height:auto; aspect-ratio:1/1; background:#0d0f14}
.card.on{border-color:var(--keep); box-shadow:0 0 0 1px var(--keep)}
.card .tick{position:absolute; top:9px; right:9px; width:30px; height:30px; border-radius:50%;
  background:var(--keep); color:#0f1a15; display:none; place-items:center; font-weight:900}
.card.on .tick{display:grid}
.card .meta{padding:7px 9px 9px; font-size:11px; color:var(--dim); display:flex; flex-direction:column; gap:3px}
.card .nm{color:var(--ink); font-weight:600; font-size:12.5px}
.sw{display:inline-flex; gap:3px; vertical-align:-2px}
.sw i{width:11px; height:11px; border-radius:3px; border:1px solid rgba(140,140,150,.4)}

/* the deck: one card at a time, made for a thumb */
#deck{display:none; flex-direction:column; align-items:center; gap:12px; padding:8px 0 100px}
#deck .stage{position:relative; width:min(94vw,540px); aspect-ratio:1/1; touch-action:pan-y; user-select:none}
#deck .sc{position:absolute; inset:0; border-radius:16px; overflow:hidden; background:var(--panel);
  border:3px solid var(--line); box-shadow:0 18px 48px rgba(0,0,0,.45); will-change:transform}
#deck .sc img{display:block; width:100%; height:100%; object-fit:cover; pointer-events:none}
#deck .sc.under{transform:scale(.94) translateY(14px); opacity:.55}
#deck .sc.anim{transition:transform .26s ease, opacity .26s ease}
#deck .stamp{position:absolute; top:16px; padding:5px 11px; border-radius:8px; font-weight:800;
  letter-spacing:.07em; font-size:14px; border:3px solid; opacity:0}
#deck .keep{left:16px; color:var(--keep); border-color:var(--keep)}
#deck .pass{right:16px; color:var(--pass); border-color:var(--pass); transform:rotate(8deg)}
#deck .dmeta{width:min(94vw,540px); font-size:12px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap}
#deck .btns{display:flex; gap:14px; align-items:center}
#deck .btns button{width:64px; height:64px; border-radius:50%; border:2px solid var(--line);
  background:var(--panel); color:var(--ink); font-size:24px; cursor:pointer}
#deck .btns .no{border-color:var(--pass); color:var(--pass)}
#deck .btns .yes{border-color:var(--keep); color:var(--keep)}
#deck .fin{padding:40px 18px; text-align:center; color:var(--dim)}

.dock{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--panel);
  border-top:1px solid var(--line); padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.dock button{background:var(--ink); color:var(--ground); border:none; border-radius:9px;
  padding:9px 14px; font:inherit; font-weight:700; cursor:pointer}
.dock button.ghost{background:transparent; color:var(--dim); border:1px solid var(--line)}
.dock .n{font-size:12px; color:var(--dim); margin-right:auto}
.saved{color:var(--keep); font-size:11px}
dialog{border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--ink);
  padding:0; max-width:min(720px,94vw); width:100%}
dialog::backdrop{background:rgba(6,8,12,.6)}
dialog .dh{padding:13px 16px; border-bottom:1px solid var(--line); font-weight:700}
dialog textarea{width:100%; height:46vh; border:none; background:transparent; color:var(--ink);
  padding:13px 16px; font:12px/1.6 "IBM Plex Mono",ui-monospace,monospace; resize:none}
dialog textarea:focus{outline:none}
dialog .df{padding:11px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}
@media (max-width:640px){ .grid{grid-template-columns:repeat(2,1fr); gap:8px} main{padding:12px 10px 100px} }
</style>
</head>
<body>

<header>
  <h1>Set __SET__ &middot; Template Lab</h1>
  <p class="sub">__NOTE__</p>
  <div class="meter">
    <div class="bar"><i id="bar"></i></div>
    <div class="count mono">seen <b id="nseen">0</b>/<span id="ntot">0</span> &middot; kept <b id="nkept">0</b> <span class="saved" id="saved"></span></div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <section id="deck">
    <div class="stage" id="stage"></div>
    <div class="dmeta" id="dmeta"></div>
    <div class="btns">
      <button class="no" id="no" aria-label="Pass">&#10005;</button>
      <button class="ghost" id="undo" style="width:52px;height:52px;font-size:18px" aria-label="Undo">&#8630;</button>
      <button class="yes" id="yes" aria-label="Keep">&#10003;</button>
    </div>
  </section>
</main>

<div class="dock">
  <span class="n mono">Set __SET__</span>
  <button class="ghost" id="mode">Deck</button>
  <button class="ghost" id="reset">Start over</button>
  <button id="export">Export list</button>
</div>

<dialog id="out">
  <div class="dh">Kept templates</div>
  <textarea id="outtext" readonly></textarea>
  <div class="df"><button class="ghost" id="copy">Copy</button><button id="close">Close</button></div>
</dialog>

<script>
const CARDS = /*__CARDS__*/[];
const KEY = 'lab-set__SET__';
let st = { on:{}, seen:{}, hist:[], mode:'grid' };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.on) st = Object.assign(st, s); } catch(e){}

/* SAVE OFTEN AND ON THE WAY OUT. A phone can discard this tab at any moment;
   anything not written down when that happens is a grade the owner has to redo. */
let dirty = false;
const write = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); dirty = false;
    const s = document.getElementById('saved'); if (s){ s.textContent = 'saved'; setTimeout(() => s.textContent = '', 1200); }
  } catch(e){} };
const save = () => { dirty = true; write(); };
addEventListener('pagehide', () => { if (dirty) write(); });
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty) write(); });
addEventListener('beforeunload', () => { if (dirty) write(); });

const $ = id => document.getElementById(id);
$('ntot').textContent = CARDS.length;

function count(){
  const seen = Object.keys(st.seen).length, kept = Object.keys(st.on).length;
  $('nseen').textContent = seen; $('nkept').textContent = kept;
  $('bar').style.width = (seen / CARDS.length * 100) + '%';
}

function tile(c){
  const d = document.createElement('article');
  d.className = 'card' + (st.on[c.id] ? ' on' : '');
  d.innerHTML = '<div class="tick">&#10003;</div>'
    + '<img src="set__SET__/' + c.id + '.webp" alt="' + c.n + '" loading="lazy" decoding="async" width="448" height="448">'
    + '<div class="meta"><span class="nm"></span><span class="sub2"></span>'
    + '<span class="sw">' + (c.sw || []).map(h => '<i style="background:' + h + '"></i>').join('') + '</span>'
    + '<span class="mono" style="font-size:10px"></span></div>';
  d.querySelector('.nm').textContent = c.n;
  d.querySelector('.sub2').textContent = [c.c, c.l, c.t, c.g].filter(Boolean).join(' · ');
  d.querySelector('.mono').textContent = c.id;
  d.onclick = () => {
    if (st.on[c.id]) delete st.on[c.id]; else st.on[c.id] = 1;
    st.seen[c.id] = 1; save(); d.classList.toggle('on', !!st.on[c.id]); count();
  };
  return d;
}

function renderGrid(){
  const g = $('grid'); g.innerHTML = '';
  const frag = document.createDocumentFragment();
  CARDS.forEach(c => frag.appendChild(tile(c)));
  g.appendChild(frag); count();
}

/* ---- the deck ---- */
const nextIdx = () => CARDS.findIndex(c => !st.seen[c.id]);
function renderDeck(){
  const stage = $('stage'); stage.innerHTML = ''; count();
  const i = nextIdx();
  if (i < 0){ stage.innerHTML = '<div class="fin">Every card graded. Export the list, or press Undo to step back.</div>'; $('dmeta').textContent = ''; return; }
  const c = CARDS[i], n = CARDS[i + 1];
  const mk = (cc, under) => {
    const d = document.createElement('div'); d.className = 'sc' + (under ? ' under' : '');
    d.innerHTML = '<img src="set__SET__/' + cc.id + '.webp" alt="" decoding="async">'
      + '<span class="stamp keep">KEEP</span><span class="stamp pass">PASS</span>';
    return d;
  };
  if (n) stage.appendChild(mk(n, true));
  const top = stage.appendChild(mk(c, false));
  $('dmeta').textContent = [c.n, c.c, c.l, c.t, c.g, c.id].filter(Boolean).join('  ·  ');
  let x0 = 0, dx = 0, on = false;
  const setX = (x, anim) => { top.classList.toggle('anim', !!anim);
    top.style.transform = 'translateX(' + x + 'px) rotate(' + (x / 20) + 'deg)';
    top.querySelector('.keep').style.opacity = Math.min(1, Math.max(0, x / 90));
    top.querySelector('.pass').style.opacity = Math.min(1, Math.max(0, -x / 90)); };
  const down = e => { on = true; x0 = (e.touches ? e.touches[0].clientX : e.clientX); dx = 0; top.classList.remove('anim'); };
  const move = e => { if (!on) return; dx = (e.touches ? e.touches[0].clientX : e.clientX) - x0; setX(dx, false); };
  const up = () => { if (!on) return; on = false; if (dx > 85) decide(1); else if (dx < -85) decide(0); else setX(0, true); };
  top.addEventListener('touchstart', down, { passive:true }); top.addEventListener('touchmove', move, { passive:true }); top.addEventListener('touchend', up);
  top.addEventListener('mousedown', down); addEventListener('mousemove', move); addEventListener('mouseup', up);
  top.__fly = d2 => { setX(d2 * innerWidth, true); top.style.opacity = '0'; };
}
function decide(keep){
  const i = nextIdx(); if (i < 0) return;
  const c = CARDS[i], top = $('stage').querySelector('.sc:not(.under)');
  if (top && top.__fly) top.__fly(keep ? 1 : -1);
  st.seen[c.id] = 1; if (keep) st.on[c.id] = 1; else delete st.on[c.id];
  st.hist.push(c.id); if (st.hist.length > 600) st.hist.shift();
  save(); setTimeout(renderDeck, 230);
}
function undo(){ const id = st.hist.pop(); if (!id) return; delete st.seen[id]; delete st.on[id]; save(); renderDeck(); }

function setMode(m){
  st.mode = m; save();
  const deck = m === 'deck';
  $('deck').style.display = deck ? 'flex' : 'none';
  $('grid').style.display = deck ? 'none' : 'grid';
  $('mode').textContent = deck ? 'Grid' : 'Deck';
  if (deck) renderDeck(); else renderGrid();
}
$('no').onclick = () => decide(0); $('yes').onclick = () => decide(1); $('undo').onclick = undo;
$('mode').onclick = () => setMode(st.mode === 'deck' ? 'grid' : 'deck');
$('reset').onclick = () => { if (!confirm('Clear every grade for this set?')) return; st = { on:{}, seen:{}, hist:[], mode: st.mode }; save(); setMode(st.mode); };
$('export').onclick = () => {
  const kept = CARDS.filter(c => st.on[c.id]);
  $('outtext').value = kept.length ? kept.map(c => c.id + '  ' + c.n + ' · ' + c.c + ' · ' + c.l + ' · ' + c.t).join('\n') : 'Nothing kept yet.';
  $('out').showModal();
};
$('close').onclick = () => $('out').close();
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('outtext').value); $('copy').textContent = 'Copied'; }
  catch(e){ $('outtext').select(); $('copy').textContent = 'Select and copy'; }
  setTimeout(() => $('copy').textContent = 'Copy', 1500);
};
addEventListener('keydown', e => {
  if (st.mode !== 'deck' || $('out').open) return;
  if (e.key === '1' || e.key === 'ArrowLeft'){ e.preventDefault(); decide(0); }
  else if (e.key === '2' || e.key === 'ArrowRight'){ e.preventDefault(); decide(1); }
  else if (e.key === 'Backspace'){ e.preventDefault(); undo(); }
});
setMode(st.mode || 'grid');
</script>
</body>
</html>
