<!doctype html>
<!-- A page's link preview (og:image), 1200 x 630, drawn by scripts/build_og_cards.mjs through
     window.paint(): main's share card (tools/brand/share-card.html, DESIGN-LAW 147 and 148) with the
     page's own kicker and title and the page's own ad in place of the home page's four. The home
     page and the information pages use the share card itself (assets/brand/share-card.jpg). -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Inter Tight"; src: url("../assets/fonts/inter-tight-latin.woff2") format("woff2"); font-weight: 500 800; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: #f4f7ff;
  font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; background: #070d1c; }
.glow-a, .glow-b { position: absolute; border-radius: 50%; }
.glow-a { width: 900px; height: 900px; right: -320px; top: -420px; background: radial-gradient(closest-side, rgba(61, 139, 255, 0.34), rgba(61, 139, 255, 0) 70%); }
.glow-b { width: 760px; height: 760px; left: -280px; bottom: -480px; background: radial-gradient(closest-side, rgba(47, 213, 143, 0.22), rgba(47, 213, 143, 0) 70%); }
.left { position: absolute; left: 72px; top: 64px; width: 590px; }
.wordmark { font: 750 44px/1 "Inter Tight", sans-serif; letter-spacing: -0.04em; }
.wordmark span { color: #3d8bff; }
.kicker { display: inline-flex; align-items: center; gap: 12px; margin-top: 52px; padding: 9px 18px 9px 14px; border-radius: 99px; background: rgba(61, 139, 255, 0.16); color: #a9cbff; font-size: 17.5px; font-weight: 600; white-space: nowrap; }
.kicker i { width: 11px; height: 11px; border-radius: 50%; background: #2fd58f; box-shadow: 0 0 0 5px rgba(47, 213, 143, 0.22); }
h1 { margin: 24px 0 0; font-size: 66px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; }
h1 span { color: #2fd58f; }
.foot { position: absolute; left: 72px; bottom: 56px; font-size: 25px; color: #a3aec6; font-weight: 500; }
.foot b { color: #f4f7ff; font-weight: 700; }
.ads { position: absolute; right: 70px; top: 76px; width: 450px; height: 470px; display: grid; place-items: center; transform: rotate(-4deg); }
.ads img { display: block; width: 100%; height: auto; border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 30px 60px -24px rgba(0, 0, 0, 0.7); }
.ads.two { grid-template-columns: 1fr 1fr; gap: 18px; }
.ads.two img:nth-child(2n) { transform: translateY(46px); }
</style></head><body>
<div class="glow-a"></div><div class="glow-b"></div>
<div class="left">
  <div class="wordmark">WeBuy<span>.AD</span></div>
  <div class="kicker"><i></i><span id="kicker"></span></div>
  <h1 id="title"></h1>
</div>
<div class="foot"><b>webuy.ad</b> · Free to design</div>
<div class="ads" id="ads"></div>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
/* cfg: { badge, title ("{...}" marks the phrase in mint), ads: [data URLs] }; the builder's colour
   fields are the ad's own pair and are not used here: the card wears the site's colours */
window.paint = async (c) => {
  document.getElementById('kicker').textContent = c.badge || '';
  const t = document.getElementById('title');
  t.innerHTML = esc(c.title).replace(/\{([^}]*)\}/g, '<span>$1</span>');
  const box = document.getElementById('ads');
  box.className = 'ads' + ((c.ads || []).length > 1 ? ' two' : '');
  box.innerHTML = (c.ads || []).slice(0, 4).map((u) => `<img src="${u}" alt="">`).join('');
  await Promise.all([...box.querySelectorAll('img')].map((i) => i.decode().catch(() => {})));
  await document.fonts.ready;
  /* the title never runs past its column or three lines: step the size down until it fits */
  let size = 66;
  t.style.fontSize = size + 'px';
  const tooWide = () => t.scrollWidth > t.clientWidth + 1;
  while ((tooWide() || t.getBoundingClientRect().height > size * 1.02 * 3 + 4) && size > 44) { size -= 2; t.style.fontSize = size + 'px'; }
  return { size };
};
</script>
</body></html>
