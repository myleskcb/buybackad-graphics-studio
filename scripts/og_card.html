<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- The link-preview card (1200x630) every public page shares, drawn around a real full ad
     (DESIGN-LAW 146). scripts/build_og_cards.mjs opens this page, calls paint(cfg) and takes the
     screenshot. The look is the full ad's: the pair's ground with its lit patch, the house face in
     capitals with the double outline, one accent, chips with ticks. -->
<style>
@font-face{font-family:'Chivo';src:url('../assets/fonts/chivo-900.woff2') format('woff2');font-weight:100 900;font-display:block}
:root{--ground:#031b56;--lit:#395185;--ink:#f2f7ff;--accent:#f4b100;--on:#031b56}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(70% 95% at 78% 50%,var(--lit) 0%,transparent 70%),var(--ground);color:var(--ink);font-family:'Chivo',Arial Black,sans-serif;position:relative}
.copy{position:absolute;left:64px;top:56px;width:530px;display:flex;flex-direction:column;gap:18px}
.mark{font-weight:900;font-size:30px;letter-spacing:.01em}.mark em{font-style:normal;color:var(--accent)}
.badge{align-self:flex-start;background:var(--accent);color:var(--on);font-weight:900;font-size:19px;letter-spacing:.07em;text-transform:uppercase;padding:10px 18px;border-radius:999px;box-shadow:0 0 28px color-mix(in srgb,var(--accent) 55%,transparent)}
.title{isolation:isolate;font-weight:900;text-transform:uppercase;line-height:.98;letter-spacing:-.005em}
.dbl{display:block;position:relative;color:var(--ink);-webkit-text-stroke:.075em var(--ground);paint-order:stroke fill}
.dbl em{font-style:normal;color:var(--accent)}
.dbl::before{content:attr(data-t);position:absolute;inset:0;z-index:-1;color:var(--accent);-webkit-text-stroke:.19em var(--accent)}
.sub{font-weight:700;font-size:26px;line-height:1.25;max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{background:var(--accent);color:var(--on);font-weight:900;font-size:18px;text-transform:uppercase;padding:9px 15px;border-radius:999px}
.chips span::before{content:"\2713  "}
.ads{position:absolute;right:60px;top:50%;transform:translateY(-50%)}
.ads img{display:block;border-radius:18px;box-shadow:0 26px 60px -22px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.08)}
.one img{width:480px;height:480px}
.fan{width:480px;height:540px}
.fan img{position:absolute;width:276px;height:345px}
.fan img:nth-child(1){left:0;top:110px;transform:rotate(-7deg)}
.fan img:nth-child(2){left:204px;top:120px;transform:rotate(7deg)}
.fan img:nth-child(3){left:92px;top:36px;z-index:2;width:296px;height:370px}
</style></head>
<body>
<div class="copy">
  <div class="mark">BUYBACK<em>.AD</em></div>
  <div class="badge" id="badge"></div>
  <div class="title" id="title"></div>
  <div class="sub" id="sub"></div>
  <div class="chips" id="chips"></div>
</div>
<div class="ads" id="ads"></div>
<script>
window.paint = async (c) => {
  const r = document.documentElement.style;
  for (const k of ['ground', 'lit', 'ink', 'accent', 'on']) if (c[k]) r.setProperty('--' + k, c[k]);
  document.getElementById('badge').textContent = c.badge || '';
  const t = document.getElementById('title');
  const plain = c.title.replace(/[{}]/g, '');
  t.innerHTML = '<span class="dbl"></span>';
  const s = t.firstChild; s.dataset.t = plain;
  s.innerHTML = c.title.replace(/[&<>]/g, x => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[x])).replace(/\{([^}]*)\}/g, '<em>$1</em>');
  t.style.fontSize = (c.size || 70) + 'px';
  document.getElementById('sub').textContent = c.sub || '';
  document.getElementById('chips').innerHTML = (c.chips || []).map(x => '<span>' + x + '</span>').join('');
  const ads = document.getElementById('ads');
  ads.className = 'ads ' + (c.ads.length > 1 ? 'fan' : 'one');
  ads.innerHTML = c.ads.map((u, i) => '<img alt="" src="' + u + '">').join('');
  await Promise.all([...ads.images || ads.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
  await document.fonts.ready;
  // the title never runs past its column: step the size down until it fits three lines
  // the outer ring stands .19em past the letters, so the widest line is measured with it
  let size = c.size || 70;
  const widest = () => { const rg = document.createRange(); rg.selectNodeContents(s); return Math.max(...[...rg.getClientRects()].map(r => r.right)) + size * .19; };
  while ((widest() > 64 + 530 || t.getBoundingClientRect().height > size * 0.98 * 3 + 4) && size > 40) { size -= 2; t.style.fontSize = size + 'px'; }
  return { size };
};
</script>
</body></html>
