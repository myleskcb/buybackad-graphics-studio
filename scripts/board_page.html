<title>iPhone Ad Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a contact sheet. A sticky filter bar over a grid of square proofs,
   each captioned like a print proof (its id, its audit, its parts). */
:root {
  --bg: #eef0f3;          /* cool paper grey, a hair toward the cyan accent */
  --panel: #ffffff;
  --ink: #15181d;
  --ink-2: #4a515c;
  --ink-3: #737b87;
  --line: #d6dae0;
  --accent: #007f8c;      /* the studio's neon cyan, deepened to read on paper */
  --accent-wash: #d7eff1;
  --pick: #d11d5f;
  --ok: #1f7a4d;
  --shadow: 0 1px 2px rgba(15, 20, 30, .06), 0 6px 18px rgba(15, 20, 30, .06);
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --panel: #1b1e24; --ink: #eef1f4; --ink-2: #b8bfc9; --ink-3: #8a93a0; --line: #2c3139;
    --accent: #3fd6e4; --accent-wash: #173338; --pick: #ff5c95; --ok: #5fd39a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --panel: #1b1e24; --ink: #eef1f4; --ink-2: #b8bfc9; --ink-3: #8a93a0; --line: #2c3139;
  --accent: #3fd6e4; --accent-wash: #173338; --pick: #ff5c95; --ok: #5fd39a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 14px; }
h1 { font: 800 clamp(34px, 5vw, 52px)/0.95 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }   /* no uppercase: it would print "IPHONE" */
.lede { margin: 6px 0 0; color: var(--ink-2); max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 0; list-style: none; font: 500 12.5px/1.4 var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.facts b { color: var(--ink); font-weight: 700; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font: 600 10.5px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
select { width: 100%; font: 500 13.5px/1.2 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 9px; }
.count { font: 600 13px/1 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); }
.btn { font: 600 13px/1 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); }
.btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pick); }
.note { font-size: 12.5px; color: var(--ink-3); }
.spacer { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.ad { background: var(--panel); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
.ad.picked { outline: 2px solid var(--pick); outline-offset: 0; }
.shot { display: block; border: 0; padding: 0; margin: 0; background: #0d0f12; cursor: zoom-in; aspect-ratio: 1 / 1; width: 100%; max-width: 100%; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cap { display: flex; flex-direction: column; gap: 5px; padding: 9px 11px 11px; }
.cap .top { display: flex; align-items: center; gap: 8px; }
.id { font: 700 12px/1 var(--mono); color: var(--ink); }
.pass { font: 500 11px/1 var(--mono); color: var(--ok); }
.cap .top .spacer { flex: 1; }
.heart { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; width: 32px; height: 32px; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-3); flex: none; }
.heart svg { width: 16px; height: 16px; }
.heart[aria-pressed="true"] { color: var(--pick); border-color: var(--pick); }
.heart[aria-pressed="true"] svg path { fill: currentColor; }
.claim { font: 800 17px/1.1 var(--display); letter-spacing: .02em; }   /* the claims are already caps, spelled iPHONE */
.parts { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.parts span + span::before { content: " · "; color: var(--ink-3); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line); }
.empty { padding: 48px 16px; text-align: center; color: var(--ink-2); grid-column: 1 / -1; }
dialog { border: 0; padding: 0; background: transparent; width: min(92vw, 760px, calc(100dvh - 220px)); max-width: none; min-width: min(92vw, 300px); }
dialog::backdrop { background: rgba(8, 10, 14, .78); }
.lb { background: var(--panel); color: var(--ink); border-radius: 14px; overflow: auto; max-height: 94dvh; }
.lb img { width: 100%; height: auto; aspect-ratio: 1 / 1; display: block; background: #0d0f12; }
.lb .cap { padding: 12px 14px 14px; }
@media (prefers-reduced-motion: no-preference) { .ad { transition: transform .15s ease; } .ad:hover { transform: translateY(-2px); } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>iPhone Ad Board</h1>
      <p class="lede">Every ad here passed the studio's audit at 100%: the gallery render, Easy Mode in square, 3:4 and 9:16, and the video. Tap the heart on the ones you want as real cards; your picks are saved to this board.</p>
    </div>
    <ul class="facts" id="facts"><li>loading the board…</li></ul>
  </header>

  <div class="bar">
    <div class="filters" id="filters"></div>
    <div class="row2">
      <span class="count" id="count"></span>
      <button class="btn" id="only-picks" type="button" aria-pressed="false"><span class="dot" aria-hidden="true"></span>Picks only</button>
      <button class="btn" id="copy" type="button">Copy pick list</button>
      <button class="btn" id="reset" type="button">Reset filters</button>
      <span class="spacer"></span>
      <span class="note" id="saved"></span>
    </div>
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>
</div>

<dialog id="lb" aria-label="Ad preview">
  <div class="lb">
    <img id="lb-img" alt="" width="800" height="800">
    <div class="cap" id="lb-cap"></div>
  </div>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  const VOICE = { street: 'Street', bold: 'Bold', stadium: 'Stadium', sport: 'Sport', tech: 'Tech', block: 'Block', arcade: 'Arcade', squad: 'Squad', comic: 'Comic', marker: 'Marker', retro: 'Retro', luxe: 'Luxe', warp: 'Warp', stencil: 'Stencil', aesthetic: 'Aesthetic' };
  const AESTHETIC = new Set(['holo', 'iridescent', 'opal', 'vaporwave', 'mermaid', 'y2k', 'cottoncandy', 'lavender', 'oilslick', 'prism', 'ultraviolet', 'aqua', 'sherbet', 'peach']);
  const lookFamily = l => !l || l === 'solid' ? 'Solid' : l === 'outline' ? 'White + outline' : l === 'signature' ? 'Signature' : l === 'street' ? 'Street'
    : /^gradient /.test(l) ? (AESTHETIC.has(l.slice(9)) ? 'Aesthetic gradient' : 'Gradient') : /^pattern /.test(l) ? 'Pattern'
    : l === 'glow' ? 'Glow' : l === 'extrude' ? '3-D block' : l === 'anaglyph' ? 'Red & blue 3-D' : l === 'multicolor' ? 'Multicolour' : l;
  const lookLabel = l => !l || l === 'solid' ? 'Solid' : /^(gradient|pattern) /.test(l) ? l.replace(/^(\w+) (.+)$/, (m, a, b) => b.replace(/^./, c => c.toUpperCase()) + ' ' + a) : lookFamily(l);
  const phoneLabel = p => 'iPhone ' + p.replace(/-back--/, ' ').replace(/-/g, ' ').replace(/\bpro\b/g, 'Pro').replace(/\bmax\b/g, 'Max').replace(/\bair\b/g, 'Air')
    .replace(/(\d+)e\b/, '$1E').replace(/ (soft pink|pink|teal|ultramarine|white|black)$/, m => ' ' + m.trim().replace(/\b\w/g, c => c.toUpperCase()));
  const groundClass = r => /^gradient /.test(r.ground) ? 'Dark gradient' : r.light ? 'Light photo' : 'Dark or mid photo';
  const FILTERS = [
    ['voice', 'Voice', r => VOICE[r.voice] || r.voice],
    ['look', 'Tagline look', r => lookFamily(r.look)],
    ['claim', 'Claim', r => r.claim],
    ['badge', 'Badge', r => r.badge],
    ['phone', 'Phone', r => phoneLabel(r.phone)],
    ['cta', 'CTA shape', r => r.cta.replace(/^./, c => c.toUpperCase())],
    ['plate', 'Step plates', r => r.plate.replace(/^./, c => c.toUpperCase())],
    ['outline', 'Outline', r => r.outline ? 'With outline' : 'No outline'],
    ['ground', 'Ground', groundClass],
  ];
  let rows = [], picks = new Set(), onlyPicks = false, db = null, shared = false;
  const sel = {};
  const store = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e){} } };

  function buildFilters(){
    const box = $('filters'); box.innerHTML = '';
    FILTERS.forEach(([key, label, get]) => {
      const vals = [...new Set(rows.map(get))].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
      const f = document.createElement('div'); f.className = 'field';
      const id = 'f-' + key;
      f.innerHTML = '<label for="' + id + '">' + label + '</label>';
      const s = document.createElement('select'); s.id = id;
      s.innerHTML = '<option value="">All</option>' + vals.map(v => { const n = rows.filter(r => get(r) === v).length; return '<option value="' + esc(v) + '">' + esc(v) + ' (' + n + ')</option>'; }).join('');
      s.value = sel[key] || '';
      s.onchange = () => { sel[key] = s.value; store.set('board.filters', sel); render(); };
      f.appendChild(s); box.appendChild(f);
    });
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function visible(){
    return rows.filter(r => FILTERS.every(([key, , get]) => !sel[key] || get(r) === sel[key]) && (!onlyPicks || picks.has(r.id)));
  }
  function card(r){
    const a = document.createElement('article'); a.className = 'ad' + (picks.has(r.id) ? ' picked' : ''); a.dataset.id = r.id;
    const alt = r.claim + ' with ' + r.badge + ' badge, ' + (VOICE[r.voice] || r.voice) + ' voice, ' + phoneLabel(r.phone);
    a.innerHTML = '<button class="shot" type="button" aria-label="Open ' + r.id + ' larger"><img loading="lazy" decoding="async" src="t/' + r.id + '.webp" alt="' + esc(alt) + '" width="800" height="800"></button>' +
      '<div class="cap"><div class="top"><span class="id">' + r.id + '</span><span class="pass">' + r.checks + '/' + r.checks + ' checks</span><span class="spacer"></span>' +
      '<button class="heart" type="button" aria-pressed="' + (picks.has(r.id) ? 'true' : 'false') + '" aria-label="Pick ' + r.id + '">' + HEART + '</button></div>' +
      '<div class="claim">' + esc(r.claim) + '</div>' +
      '<div class="parts"><span>' + esc(r.badge) + '</span><span>' + esc(VOICE[r.voice] || r.voice) + '</span><span>' + esc(lookLabel(r.look)) + '</span></div>' +
      '<div class="parts"><span><i class="swatch" style="background:' + esc(r.accent) + '"></i>' + esc(r.accent) + '</span><span>' + esc(phoneLabel(r.phone)) + '</span><span>' + esc(r.cta) + ' CTA</span></div></div>';
    a.querySelector('.heart').onclick = () => togglePick(r.id);
    a.querySelector('.shot').onclick = () => openLb(r);
    return a;
  }
  function render(){
    const list = visible(), grid = $('grid');
    grid.innerHTML = '';
    if (!list.length){
      grid.innerHTML = '<p class="empty">' + (onlyPicks && !picks.size ? 'No picks yet. Tap the heart on an ad to pick it.' : 'No ads match these filters. Reset the filters to see the whole board.') + '</p>';
    } else {
      const frag = document.createDocumentFragment(); list.forEach(r => frag.appendChild(card(r))); grid.appendChild(frag);
    }
    $('count').innerHTML = '<b>' + list.length + '</b> of ' + rows.length + ' ads · <b>' + picks.size + '</b> picked';
  }
  function syncPicks(){
    document.querySelectorAll('.ad').forEach(a => { const on = picks.has(a.dataset.id); a.classList.toggle('picked', on); const h = a.querySelector('.heart'); if (h) h.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    $('count').innerHTML = '<b>' + visible().length + '</b> of ' + rows.length + ' ads · <b>' + picks.size + '</b> picked';
    if (onlyPicks) render();
  }
  const writing = {};      // one write at a time per pick: a quick double tap queues, it never overlaps
  async function togglePick(id){
    const on = !picks.has(id);
    if (on) picks.add(id); else picks.delete(id);
    syncPicks();
    if (db && shared){
      const write = async () => { const ref = db.doc('picks/' + id); if (on) await ref.set({ picked: true, at: new Date().toISOString() }); else await ref.delete(); };
      writing[id] = (writing[id] || Promise.resolve()).then(write).catch(() => {
        shared = false; $('saved').textContent = 'Picks could not be saved to the board, so they are kept in this browser.'; store.set('board.picks', [...picks]); });
      await writing[id];
    } else store.set('board.picks', [...picks]);
  }
  function openLb(r){
    const d = $('lb');
    $('lb-img').src = 't/' + r.id + '.webp'; $('lb-img').alt = r.claim + ', ' + r.badge;
    $('lb-cap').innerHTML = '<div class="top"><span class="id">' + r.id + '</span><span class="pass">' + r.checks + '/' + r.checks + ' checks</span><span class="spacer"></span>' +
      '<button class="heart" type="button" aria-pressed="' + (picks.has(r.id) ? 'true' : 'false') + '" aria-label="Pick ' + r.id + '">' + HEART + '</button>' +
      '<button class="btn" type="button" id="lb-close">Close</button></div>' +
      '<div class="claim">' + esc(r.claim) + '</div>' +
      '<div class="parts"><span>' + esc(r.badge) + ' badge</span><span>' + esc(VOICE[r.voice] || r.voice) + ' voice</span><span>' + esc(r.faces || r.fonts) + '</span></div>' +
      '<div class="parts"><span>' + esc(lookLabel(r.look)) + '</span><span><i class="swatch" style="background:' + esc(r.accent) + '"></i>' + esc(r.accent) + '</span><span>' + esc(phoneLabel(r.phone)) + '</span></div>' +
      '<div class="parts"><span>' + esc(r.cta) + ' CTA</span><span>' + esc(r.plate) + ' plates' + (r.outline ? ', outlined' : '') + '</span><span>' + esc(r.ground) + '</span></div>';
    $('lb-close').onclick = () => d.close();
    const h = $('lb-cap').querySelector('.heart'); h.onclick = async () => { await togglePick(r.id); h.setAttribute('aria-pressed', picks.has(r.id) ? 'true' : 'false'); };
    try { d.showModal(); } catch (e){ d.setAttribute('open', ''); }
  }
  $('lb').addEventListener('click', e => { if (e.target === $('lb')) $('lb').close(); });
  $('only-picks').onclick = () => { onlyPicks = !onlyPicks; $('only-picks').setAttribute('aria-pressed', onlyPicks ? 'true' : 'false'); render(); };
  $('reset').onclick = () => { Object.keys(sel).forEach(k => { sel[k] = ''; }); store.set('board.filters', sel); buildFilters(); render(); };
  $('copy').onclick = async () => {
    const text = [...picks].sort().join(', ') || 'no picks yet';
    try { await navigator.clipboard.writeText(text); $('saved').textContent = 'Copied: ' + text.slice(0, 80) + (text.length > 80 ? '…' : ''); }
    catch (e){
      $('saved').textContent = 'Your picks: ' + text;
      try { const r = document.createRange(); r.selectNodeContents($('saved')); const w = getSelection(); w.removeAllRanges(); w.addRange(r); } catch (e2){}
    }
  };

  fetch('board.json').then(r => r.json()).then(data => {
    rows = data;
    Object.assign(sel, store.get('board.filters', {}));
    const uniq = f => new Set(rows.map(f)).size;
    $('facts').innerHTML = '<li><b>' + rows.length + '</b> ads</li><li><b>' + uniq(r => r.voice) + '</b> voices</li><li><b>' + uniq(r => r.fonts) + '</b> type pairs</li>' +
      '<li><b>' + uniq(r => r.claim) + '</b> claims</li><li><b>' + uniq(r => r.badge) + '</b> badges</li><li><b>' + uniq(r => r.look || 'solid') + '</b> looks</li>' +
      '<li><b>' + uniq(r => r.phone) + '</b> phones</li><li><b>' + uniq(r => r.ground) + '</b> grounds</li>';
    buildFilters(); render();
  }).catch(() => { $('grid').innerHTML = '<p class="empty">The board could not load its list of ads. Reload the page to try again.</p>'; });

  // picks: the board's shared store when this view has it, else this browser
  picks = new Set(store.get('board.picks', []));
  $('saved').textContent = 'Picks are kept in this browser.';
  (async () => {
    const c = window.claude;
    db = c && c.use ? await c.use('db') : null;
    if (!db) return;
    shared = true;
    $('saved').textContent = 'Picks are saved to the board.';
    db.collection('picks').onSnapshot(snap => {
      picks = new Set(snap.docs.filter(d => d.exists && d.data() && d.data().picked).map(d => d.id));
      syncPicks();
    }, () => { shared = false; $('saved').textContent = 'The board’s saved picks are unavailable, so picks are kept in this browser.'; });
  })();
})();
</script>
