<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not found | BUYBACK.AD</title>
    <style>
      /* Deliberately dependency-free: a 404 that waits on app.js or a webfont is a 404 that shows a
         blank page first. The house look (DESIGN-LAW 145) in the system's own heavy face: Silver &
         Blue in light, Navy & Gold in dark, a claim badge and the pill, hardcoded for the same reason. */
      :root { color-scheme: light; --g: #e2e8f3; --ink: #111b30; --ink2: #2c3a57; --a: #1d4ed8; --on: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --g: #031b56; --ink: #f2f7ff; --ink2: #c9d4ec; --a: #f4b100; --on: #031b56; } }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--g); color: var(--ink);
        font: 500 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: grid; place-items: center; text-align: center; padding: 24px;
      }
      .code { display: inline-block; background: var(--a); color: var(--on); font-weight: 800; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 14px; border-radius: 999px; }
      h1 { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; margin: 14px 0 8px; }
      p { color: var(--ink2); margin: 0 0 22px; }
      a.go { display: inline-block; text-decoration: none; background: var(--a); color: var(--on); font-weight: 900; text-transform: uppercase; letter-spacing: .05em; font-size: 14px; padding: 14px 24px; border-radius: 999px; }
      nav { margin-top: 18px; font-size: 14.5px; }
      nav a { color: var(--ink); font-weight: 700; text-decoration-color: var(--a); text-decoration-thickness: 2px; text-underline-offset: 3px; }
      a:focus-visible { outline: 3px solid var(--a); outline-offset: 3px; border-radius: 8px; }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>That page isn't here</h1>
      <p>The link may be old, or the page may have moved.</p>
      <a class="go" href="/">Back to BUYBACK.AD</a>
      <nav><a href="/#lp-templates">Templates</a> &middot; <a href="/motion/">Video ads</a> &middot; <a href="/about.html">About</a> &middot; <a href="/#faq">FAQ</a></nav>
    </main>
  </body>
</html>
