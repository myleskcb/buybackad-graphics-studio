<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="robots" content="noindex" />
    <title>Not found — Graphics Studio</title>
    <style>
      /* Deliberately dependency-free: a 404 that waits on app.js or a webfont
         is a 404 that shows a blank page first. Colours are the house field and
         accent (graphite and orchid, the site's default look), hardcoded for the same reason. */
      html, body { height: 100%; margin: 0; }
      body {
        background: #0e0d15;
        color: #f1eff8;
        font: 500 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .code { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #a19cb3; }
      h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 10px 0 8px; }
      p { color: #c3bfd2; margin: 0 0 22px; }
      a {
        display: inline-block; text-decoration: none;
        background: #b48cff;
        color: #140a24; font-weight: 650;
        padding: 12px 22px; border-radius: 999px;
      }
      a.plain { background: none; color: #c4a8ff; padding: 0; text-decoration: underline; font-weight: 600; }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>That page isn't here</h1>
      <p>The link may be old, or the page may have moved.</p>
      <a href="/">Back to Graphics Studio</a>
      <nav style="margin-top:18px;font-size:14px"><a class="plain" href="/#lp-templates">Templates</a> &middot; <a class="plain" href="/about.html">About</a> &middot; <a class="plain" href="/#faq">FAQ</a></nav>
