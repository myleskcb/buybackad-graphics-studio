<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buyback Graphics Console</title>
<style>

:root{
  --bg:#0b0d10; --panel:#12161b; --panel2:#171c23; --line:#232a33;
  --ink:#e8edf3; --dim:#9aa6b4; --faint:#828a99;
  --ok:#3ddc84; --warn:#ffc93c; --bad:#ff5d5d; --live:#4cc9f0;
  --pad:14px; --r:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

/* ── top bar ─────────────────────────────────────────────── */
.top{display:flex;align-items:center;gap:10px;padding:0 var(--pad);height:52px;
  border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:nowrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.logo i{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;
  background:var(--ok);color:#062;font-style:normal;font-weight:800;font-size:12px}
.logo small{display:block;font-weight:500;font-size:10px;color:var(--faint);letter-spacing:.08em}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 11px;font-size:12px;color:var(--dim);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#0b0d10;font-weight:600}
.btn{padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  color:var(--dim);font-size:12px;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--faint)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#062;font-weight:600}
.grow{flex:1}
.seedbox{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--faint)}

/* ── three columns ───────────────────────────────────────── */
.wrap{display:grid;grid-template-columns:248px minmax(0,1fr) 336px;
  height:calc(100vh - 52px);overflow:hidden}
.col{overflow-y:auto;overscroll-behavior:contain}
.col::-webkit-scrollbar{width:9px}
.col::-webkit-scrollbar-thumb{background:#28303a;border-radius:9px}

/* ── left: the switches ──────────────────────────────────── */
.rail{border-right:1px solid var(--line);background:var(--panel)}
.railtop{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px var(--pad) 8px;
  border-bottom:1px solid var(--line)}
.railtop h2{margin:0 0 2px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.railtop p{margin:0;font-size:11px;color:var(--dim);line-height:1.35}
.grp{padding:9px var(--pad) 3px}
.grp h3{margin:0 0 5px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sw{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;
  padding:6px 7px;border-radius:8px;cursor:pointer;margin:1px -7px}
.sw:hover{background:var(--panel2)}
.sw:focus-visible{outline:2px solid var(--live);outline-offset:-2px}
.sw .dot{width:26px;height:15px;border-radius:8px;background:#2a323c;position:relative;transition:background .12s}
.sw .dot::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:var(--faint);transition:transform .12s,background .12s}
.sw[aria-checked=true] .dot{background:rgba(61,220,132,.28)}
.sw[aria-checked=true] .dot::after{transform:translateX(11px);background:var(--ok)}
.sw b{display:block;font-weight:500;font-size:12px}
.sw[aria-checked=true] b{font-weight:600}
.sw i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);line-height:1.3}
.sw .imp{font:10px var(--mono);color:var(--faint);min-width:26px;text-align:right}
.sw .imp.pos{color:var(--ok)} .sw .imp.neg{color:var(--bad)}
.sw[data-last=true]{box-shadow:inset 2px 0 0 var(--live)}

/* ── centre: the card ────────────────────────────────────── */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:#090b0e}
.archrow{display:flex;gap:5px;padding:9px var(--pad);border-bottom:1px solid var(--line);
  overflow-x:auto;background:var(--panel);scrollbar-width:none}
.archrow::-webkit-scrollbar{display:none}
.archrow button{padding:5px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;
  color:var(--dim);white-space:nowrap}
.archrow button[aria-pressed=true]{background:var(--ink);color:#0b0d10;border-color:var(--ink);font-weight:600}
.canvas{flex:1;display:grid;place-items:center;padding:16px;min-height:0}
.card{position:relative;max-width:100%;max-height:100%;border-radius:6px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.6);background:#000;line-height:0}
.card svg{display:block}
.canvas{overflow:hidden}
.card.flash{outline:2px solid var(--live)}
.readout{display:flex;gap:0;border-top:1px solid var(--line);background:var(--panel)}
.gauge{flex:1;padding:8px 10px;border-right:1px solid var(--line);min-width:0}
.gauge:last-child{border-right:0}
.gauge span{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge b{font:15px/1.2 var(--mono);font-weight:600}
.gauge b.ok{color:var(--ok)} .gauge b.mid{color:var(--warn)} .gauge b.no{color:var(--bad)}

/* ── right: one panel at a time ──────────────────────────── */
.side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;padding:10px 4px;font-size:11.5px;color:var(--dim);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ok);font-weight:600}
.pane{padding:12px var(--pad) 26px}
.pane[hidden]{display:none}
.rules{display:flex;flex-direction:column;gap:1px}
.rule{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:baseline;padding:6px 7px;
  border-radius:7px;margin:0 -7px}
.rule.fail{background:rgba(255,93,93,.09)}
.rule code{font:10px var(--mono);color:var(--faint)}
.rule.fail code{color:var(--bad)}
.rule b{font-weight:500;font-size:12px}
.rule.fail b{font-weight:600;color:var(--bad)}
.rule i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);line-height:1.35}
.rule.fail i{color:#ff9a9a}
.note{font:10.5px/1.5 var(--mono);color:var(--warn);background:rgba(255,201,60,.07);
  border-left:2px solid var(--warn);padding:6px 8px;border-radius:0 6px 6px 0;margin:3px 0;
  white-space:pre-wrap;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 12px}
.chip{padding:4px 9px;border:1px solid var(--line);border-radius:20px;font-size:11.5px;color:var(--dim)}
.chip[aria-pressed=true]{background:var(--ink);color:#0b0d10;border-color:var(--ink);font-weight:600}
.chip .sw2{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px}
h4{margin:14px 0 5px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
h4:first-child{margin-top:0}
pre{margin:0;font:10.5px/1.55 var(--mono);color:var(--dim);white-space:pre-wrap;word-break:break-word;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px}
pre.neg{color:#c98d8d}
.meter{margin:5px 0}
.meter span{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint)}
.meter div{height:3px;border-radius:3px;background:#242c36;margin-top:3px;overflow:hidden}
.meter div b{display:block;height:100%;background:var(--ok)}
.logline{font-size:11px;color:var(--dim);padding:5px 0;border-bottom:1px solid var(--line);line-height:1.4}
.logline em{font-style:normal;color:var(--faint)}
.empty{color:var(--faint);font-size:11.5px;padding:8px 0}
.grade{display:flex;gap:7px;margin-top:10px}
.grade button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);font-weight:600;font-size:12px}
.grade .keep{background:rgba(61,220,132,.13);color:var(--ok);border-color:rgba(61,220,132,.3)}
.grade .cut{background:rgba(255,93,93,.11);color:var(--bad);border-color:rgba(255,93,93,.28)}
.kbd{font:10px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  padding:1px 4px;color:var(--faint)}
.hintbar{padding:7px var(--pad);border-top:1px solid var(--line);background:var(--panel);
  font-size:10.5px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap}

/* ── narrow ──────────────────────────────────────────────── */
@media (max-width:1080px){
  body{overflow:auto}
  .wrap{grid-template-columns:1fr;height:auto}
  .col{overflow:visible}
  .rail,.side{border:0;border-top:1px solid var(--line)}
  .canvas{padding:12px}
  .card svg{max-height:none}
  .hintbar{display:none}
}
</style>

<div class="top">
  <div class="logo"><i>iL</i><span>Buyback Graphics Console<small>GFX ENGINE · 2026-09-04</small></span></div>
  <div class="seg" id="vertSeg"></div>
  <div class="seg" id="fmtSeg"></div>
  <button class="btn go" id="reroll">↻ seed</button>
  <button class="btn" id="measure">measure switches</button>
  <button class="btn" id="axisBtn">open an axis</button>
  <div class="grow"></div>
  <div class="seedbox" id="seedTag">—</div>
  <button class="btn" id="exportBtn">export</button>
</div>

<div class="wrap">
  <aside class="col rail">
    <div class="railtop">
      <h2>Design queue</h2>
      <p>Every device is a switch. <b id="onCount">—</b> on. Measure to score each one's
         contribution across all eight layouts.</p>
    </div>
    <div id="groups"></div>
  </aside>

  <main class="stage">
    <div class="archrow" id="archRow"></div>
    <div class="canvas"><div class="card" id="frame"></div></div>
    <div class="readout" id="readout"></div>
    <div class="hintbar" id="hints"></div>
  </main>

  <aside class="col side">
    <div class="tabs" id="tabs"></div>
    <div class="pane" id="pane-audit"></div>
    <div class="pane" id="pane-look" hidden></div>
    <div class="pane" id="pane-prompt" hidden></div>
    <div class="pane" id="pane-log" hidden></div>
  </aside>
</div>

<script type="module" src="console.js?v=2026-09-04"></script>
