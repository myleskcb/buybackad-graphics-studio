<!doctype html>
<meta charset="utf-8">
<title>Theme grading — swipe</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#0b0c0f;--panel:#14161b;--line:#242832;--ink:#e8eaf0;--dim:#8d93a3;
        --ok:#3ecf8e;--no:#e0475f;--star:#e8b23c}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
       font:13px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif;
       display:flex;flex-direction:column}

  header{flex:0 0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
         padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(11,12,15,.94)}
  h1{font-size:14px;margin:0 8px 0 0;font-weight:650}
  select,button{background:var(--panel);color:var(--ink);border:1px solid var(--line);
                border-radius:7px;padding:6px 10px;font:inherit;cursor:pointer}
  button:hover{border-color:#39404f}
  .count{color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto}

  /* progress */
  #bar{flex:0 0 auto;height:3px;background:#1a1d24}
  #bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

  /* the stack */
  #stage{flex:1 1 auto;position:relative;display:grid;place-items:center;padding:18px;min-height:0}
  .card{position:absolute;width:min(74vh,560px);max-width:92vw;background:var(--panel);
        border:1px solid var(--line);border-radius:18px;overflow:hidden;
        box-shadow:0 30px 80px -30px rgba(0,0,0,.85);will-change:transform;
        display:flex;flex-direction:column}
  .card .art{width:100%;aspect-ratio:1/1;display:block;background:#000;object-fit:cover}
  .card .bar{padding:9px 13px;display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--line)}
  .card .id{font:12px/1.3 ui-monospace,Menlo,monospace}
  .card .note{color:var(--dim);font-size:11px}
  /* behind cards sit slightly back so the stack reads as a stack */
  .card[data-depth="1"]{transform:translateY(14px) scale(.965);opacity:.72}
  .card[data-depth="2"]{transform:translateY(26px) scale(.935);opacity:.45}
  .card[data-depth="3"]{transform:translateY(36px) scale(.91);opacity:.22}

  /* the verdict stamp that tracks the drag */
  .stamp{position:absolute;top:22px;font:800 26px/1 ui-sans-serif;letter-spacing:2px;
         padding:8px 14px;border-radius:10px;border:3px solid;opacity:0;pointer-events:none}
  .stamp.keep{left:22px;color:var(--ok);border-color:var(--ok);transform:rotate(-12deg)}
  .stamp.kill{right:22px;color:var(--no);border-color:var(--no);transform:rotate(12deg)}

  footer{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 16px;display:flex;
         gap:14px;align-items:center;flex-wrap:wrap;background:rgba(11,12,15,.94)}
  .why{display:flex;gap:6px;flex-wrap:wrap}
  .why b{color:var(--dim);font-weight:500;align-self:center;margin-right:2px}
  .chip{background:#0e1015;border:1px solid var(--line);border-radius:999px;
        padding:5px 11px;font-size:12px;cursor:pointer;user-select:none}
  .chip.on{background:#1d2530;border-color:#3d63a8;color:#cfe0ff}
  .keys{color:var(--dim);font-size:11px;margin-left:auto;text-align:right;line-height:1.7}
  kbd{background:#0e1015;border:1px solid var(--line);border-radius:4px;padding:1px 5px;
      font:11px ui-monospace,Menlo,monospace}
  #done{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px}
  #done h2{font-size:20px;margin:0 0 8px}
</style>

<header>
  <h1>Grade themes</h1>
  <label>source <select id=src></select></label>
  <label>palette <select id=pal></select></label>
  <label>show <select id=filter>
    <option value=ungraded>ungraded</option>
    <option value=all>all</option>
    <option value=up>kept</option>
    <option value=star>starred</option>
    <option value=down>killed</option>
  </select></label>
  <button id=undo>↶ Undo</button>
  <button id=export>Export</button>
  <button id=grid>Grid view</button>
  <span class=count id=count></span>
</header>
<div id=bar><i></i></div>

<main id=stage>
  <div id=done><div><h2>Nothing left in this filter.</h2>
    <p class=note style="color:var(--dim)">Switch the source or filter above, or export what you graded.</p></div></div>
</main>

<footer>
  <div class=why id=why>
    <b>why</b>
    <span class=chip data-w=type>type</span>
    <span class=chip data-w=colour>colour</span>
    <span class=chip data-w=layout>layout</span>
    <span class=chip data-w=imagery>imagery</span>
    <span class=chip data-w=spacing>spacing</span>
    <span class=chip data-w=contrast>contrast</span>
    <span class=chip data-w=busy>too busy</span>
    <span class=chip data-w=empty>too empty</span>
    <span class=chip data-w=cheap>feels cheap</span>
    <span class=chip data-w=pro>looks pro</span>
  </div>
  <div class=keys>
    <kbd>←</kbd> kill &nbsp; <kbd>→</kbd> keep &nbsp; <kbd>↑</kbd> star &nbsp; <kbd>↓</kbd> skip<br>
    <kbd>1</kbd>–<kbd>5</kbd> score &nbsp; <kbd>U</kbd> undo &nbsp; drag the card to swipe
  </div>
</footer>

<script type="module" src="./showcase-themes.js"></script>
