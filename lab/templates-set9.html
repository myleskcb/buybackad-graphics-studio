<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set 9 · Template Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#14161c; --panel:#1b1e26; --line:#2c313d; --ink:#e9ebf1; --dim:#8f95a5;
  --keep:#5ad1a5; --pass:#ff7b7b; --accent:#ffb03a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; background:var(--ground); color:var(--ink); overflow-x:hidden}
body{font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
header{position:sticky; top:0; z-index:20; background:var(--ground); border-bottom:1px solid var(--line);
  padding:12px 16px 10px}
h1{font-size:17px; font-weight:800; margin:0 0 2px}
.sub{color:var(--dim); font-size:12.5px; margin:0 0 10px; max-width:78ch}
.meter{display:flex; align-items:center; gap:10px}
.bar{flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease}
.count{font-size:12px; color:var(--dim); white-space:nowrap}
.count b{color:var(--keep); font-weight:700}

main{padding:14px 16px 96px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--tile,190px),1fr)); gap:10px}
.zoom{display:flex;align-items:center;gap:0;border:1px solid var(--line,#232a33);border-radius:8px;overflow:hidden}
.zoom button{padding:6px 11px;font-size:15px;line-height:1;background:none;border:0;color:inherit;cursor:pointer}
.zoom button:hover{background:rgba(255,255,255,.07)}
.zoom span{padding:0 8px;font:11px ui-monospace,monospace;opacity:.65;min-width:44px;text-align:center}
.card{background:var(--panel); border:3px solid var(--line); border-radius:14px; overflow:hidden;
  cursor:pointer; position:relative; content-visibility:auto; contain-intrinsic-size:260px}
.card img{display:block; width:100%; height:auto; aspect-ratio:1/1; background:#0d0f14}
.card.on{border-color:var(--keep); box-shadow:0 0 0 1px var(--keep)}
.card .tick{position:absolute; top:9px; right:9px; width:30px; height:30px; border-radius:50%;
  background:var(--keep); color:#0f1a15; display:none; place-items:center; font-weight:900}
.card.on .tick{display:grid}
.card .meta{padding:7px 9px 9px; font-size:11px; color:var(--dim); display:flex; flex-direction:column; gap:3px}
.card .nm{color:var(--ink); font-weight:600; font-size:12.5px}
.sw{display:inline-flex; gap:3px; vertical-align:-2px}
.sw i{width:11px; height:11px; border-radius:3px; border:1px solid rgba(140,140,150,.4)}

/* the deck: one card at a time, made for a thumb */
#deck{display:none; flex-direction:column; align-items:center; gap:12px; padding:8px 0 100px}
#deck .stage{position:relative; width:min(94vw,540px); aspect-ratio:1/1; touch-action:pan-y; user-select:none}
#deck .sc{position:absolute; inset:0; border-radius:16px; overflow:hidden; background:var(--panel);
  border:3px solid var(--line); box-shadow:0 18px 48px rgba(0,0,0,.45); will-change:transform}
#deck .sc img{display:block; width:100%; height:100%; object-fit:cover; pointer-events:none}
#deck .sc.under{transform:scale(.94) translateY(14px); opacity:.55}
#deck .sc.anim{transition:transform .26s ease, opacity .26s ease}
#deck .stamp{position:absolute; top:16px; padding:5px 11px; border-radius:8px; font-weight:800;
  letter-spacing:.07em; font-size:14px; border:3px solid; opacity:0}
#deck .keep{left:16px; color:var(--keep); border-color:var(--keep)}
#deck .pass{right:16px; color:var(--pass); border-color:var(--pass); transform:rotate(8deg)}
#deck .dmeta{width:min(94vw,540px); font-size:12px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap}
#deck .btns{display:flex; gap:14px; align-items:center}
#deck .btns button{width:64px; height:64px; border-radius:50%; border:2px solid var(--line);
  background:var(--panel); color:var(--ink); font-size:24px; cursor:pointer}
#deck .btns .no{border-color:var(--pass); color:var(--pass)}
#deck .btns .yes{border-color:var(--keep); color:var(--keep)}
#deck .fin{padding:40px 18px; text-align:center; color:var(--dim)}

.dock{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--panel);
  border-top:1px solid var(--line); padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.dock button{background:var(--ink); color:var(--ground); border:none; border-radius:9px;
  padding:9px 14px; font:inherit; font-weight:700; cursor:pointer}
.dock button.ghost{background:transparent; color:var(--dim); border:1px solid var(--line)}
.dock .n{font-size:12px; color:var(--dim); margin-right:auto}
.saved{color:var(--keep); font-size:11px}
dialog{border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--ink);
  padding:0; max-width:min(720px,94vw); width:100%}
dialog::backdrop{background:rgba(6,8,12,.6)}
dialog .dh{padding:13px 16px; border-bottom:1px solid var(--line); font-weight:700}
dialog textarea{width:100%; height:46vh; border:none; background:transparent; color:var(--ink);
  padding:13px 16px; font:12px/1.6 "IBM Plex Mono",ui-monospace,monospace; resize:none}
dialog textarea:focus{outline:none}
dialog .df{padding:11px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}
@media (max-width:640px){ .grid{grid-template-columns:repeat(auto-fill,minmax(min(var(--tile,190px),46vw),1fr)); gap:8px} main{padding:12px 10px 100px} }
</style>
</head>
<body>

<header>
  <h1>Set 9 &middot; Template Lab</h1>
  <p class="sub"></p>
  <div class="meter">
    <div class="bar"><i id="bar"></i></div>
    <div class="count mono">seen <b id="nseen">0</b>/<span id="ntot">0</span> &middot; kept <b id="nkept">0</b> <span class="saved" id="saved"></span></div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <section id="deck">
    <div class="stage" id="stage"></div>
    <div class="dmeta" id="dmeta"></div>
    <div class="btns">
      <button class="no" id="no" aria-label="Pass">&#10005;</button>
      <button class="ghost" id="undo" style="width:52px;height:52px;font-size:18px" aria-label="Undo">&#8630;</button>
      <button class="yes" id="yes" aria-label="Keep">&#10003;</button>
    </div>
  </section>
</main>

<div class="dock">
  <span class="n mono">Set 9</span>
  <div class="zoom"><button id="zout" title="Smaller (−)">−</button><span id="zlabel">190</span><button id="zin" title="Bigger (+)">+</button></div>
  <button class="ghost" id="mode">Deck</button>
  <button class="ghost" id="reset">Start over</button>
  <button id="export">Export list</button>
</div>

<dialog id="out">
  <div class="dh">Kept templates</div>
  <textarea id="outtext" readonly></textarea>
  <div class="df"><button class="ghost" id="copy">Copy</button><button id="close">Close</button></div>
</dialog>

<script src="set9.js?v=88d0d737"></script>
</body>
</html>
